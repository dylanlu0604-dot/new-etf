name: Weekly New ETF Research

on:
  schedule:
    # 14:00 Asia/Taipei = 06:00 UTC, every Thursday.
    - cron: "0 6 * * 2,4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare current-run outputs
        id: prepare
        run: |
          mkdir -p artifacts
          rm -f artifacts/new_list.json artifacts/new_list.txt artifacts/etf_research.csv artifacts/research_diagnostics.json
          python - <<'PY'
          import json
          from pathlib import Path

          Path("artifacts/research_diagnostics.json").write_text(
              json.dumps({"status": "not_started", "model": "gpt-6-luna", "requested_tickers": [], "records": {}}) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install TinyFish CLI
        run: npm install --global @tiny-fish/cli

      - name: Check single-ticker repair flow
        run: python -m unittest discover -s tests

      - name: Collect new ETFs from MoneyDJ
        run: |
          mkdir -p artifacts
          python scripts/collect_new_etfs.py --output-dir artifacts

      - name: Run ETF research for new_list
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          URL_TO_MARKDOWN_FALLBACK: tinyfish
          OPENAI_BATCH_SIZE: "1"
          ETF_RESEARCH_DIAGNOSTICS: artifacts/research_diagnostics.json
        run: |
          new_list="$(tr -d '\r\n' < artifacts/new_list.txt)"
          if [ -z "$new_list" ]; then
            python - <<'PY'
          import csv
          import json
          from pathlib import Path
          from etf_research_update import CSV_COLUMNS

          with Path("artifacts/etf_research.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              csv.DictWriter(handle, fieldnames=CSV_COLUMNS).writeheader()
          Path("artifacts/research_diagnostics.json").write_text(
              json.dumps({"status": "complete", "model": "none", "requested_tickers": [], "records": {}, "row_count": 0}) + "\n",
              encoding="utf-8",
          )
          PY
            echo "new_list is empty; no ETF research call was needed."
          else
            echo "Researching new_list: $new_list"
            python etf_research_update.py -o artifacts/etf_research.csv "$new_list"
          fi

      - name: Validate complete research CSV
        id: validate_csv
        run: python scripts/validate_research_csv.py artifacts/etf_research.csv artifacts/new_list.txt

      - name: Summarize research outcome
        if: always()
        env:
          CSV_VALIDATION_OUTCOME: ${{ steps.validate_csv.outcome }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("artifacts/research_diagnostics.json")
          print("## ETF research outcome\n")
          print(f"CSV validation: **{__import__('os').environ['CSV_VALIDATION_OUTCOME']}**.\n")
          if not path.exists():
              print("No research diagnostics were produced. Check the failed step log.")
          else:
              data = json.loads(path.read_text(encoding="utf-8"))
              print(f"Status: **{data['status']}**. Model: `{data['model']}`.\n")
              print("| Ticker | Status | Attempts | Description characters | Issues |")
              print("| --- | --- | ---: | ---: | --- |")
              for ticker, record in data["records"].items():
                  issues = "; ".join(record.get("issues", []))
                  issues = issues.replace("|", "\\|").replace("\n", " ")
                  print(f"| {ticker} | {record['status']} | {record['attempts']} | {record.get('description_characters', '')} | {issues} |")
          PY

      - name: Upload weekly results
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: new-etf-research-${{ github.run_number }}
          path: |
            artifacts/new_list.json
            artifacts/new_list.txt
            artifacts/etf_research.csv
            artifacts/research_diagnostics.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit latest results to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/new_list.json artifacts/new_list.txt artifacts/etf_research.csv
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Update ETF research results"
            git push origin HEAD:${{ github.ref_name }}
          fi
